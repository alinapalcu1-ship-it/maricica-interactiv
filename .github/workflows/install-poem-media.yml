name: Instalează media poeziei Prietenii curățeniei

on:
  push:
    branches: [main]
    paths:
      - 'Maricica_Prietenii_Curateniei_Media_HD.zip'

permissions:
  contents: write
  pages: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă proiectul
        uses: actions/checkout@v4

      - name: Configurează Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verifică și instalează imaginile și audio
        run: python tools/install_poem_media.py

      - name: Publică fișierele media, fără ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/poem audio/poem Maricica_Prietenii_Curateniei_Media_HD.zip
          if ! git diff --cached --quiet; then
            git commit -m "Instalează scenele HD și audio ElevenLabs pentru poezie"
            git push
          fi

      - name: Solicită reconstruirea GitHub Pages după instalare
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
